<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTX - منصة السكربتات</title>
    <!-- استدعاء Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-color: #0d0d11;
            --card-bg: #16161e;
            --accent-purple: #8a2be2;
            --hover-purple: #9d4edf;
            --text-color: #ffffff;
            --text-muted: #a0a0b0;
            --green-btn: #28a745;
            --green-hover: #218838;
            --danger-btn: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--accent-purple);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.2);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-purple);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        nav button {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--accent-purple);
            padding: 0.5rem 1.2rem;
            margin-right: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        nav button:hover, nav button.active {
            background-color: var(--accent-purple);
            color: white;
            box-shadow: 0 0 10px var(--accent-purple);
        }

        .container {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .section { display: none; }
        .section.active { display: block; }

        h2 {
            border-bottom: 2px solid var(--accent-purple);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .script-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .script-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
        }

        .script-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #000;
        }

        .script-card-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .script-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #fff;
        }

        .btn-take {
            background-color: var(--green-btn);
            color: #fff;
            border: none;
            padding: 0.6rem;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            text-align: center;
        }

        .btn-take:hover { background-color: var(--green-hover); }

        .form-box {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 10px;
            border: 1px solid var(--accent-purple);
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background-color: #0d0d11;
            border: 1px solid rgba(138, 43, 226, 0.5);
            color: #fff;
            border-radius: 5px;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--hover-purple);
            box-shadow: 0 0 5px var(--accent-purple);
        }

        .form-group textarea { resize: vertical; height: 120px; }

        .btn-submit {
            background-color: var(--accent-purple);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .btn-submit:hover { background-color: var(--hover-purple); }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        .admin-table th, .admin-table td {
            padding: 0.8rem;
            text-align: right;
            border-bottom: 1px solid rgba(138, 43, 226, 0.2);
        }

        .admin-table th {
            background-color: rgba(138, 43, 226, 0.2);
            color: var(--accent-purple);
        }

        .admin-table img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }

        .action-btns button {
            padding: 0.4rem 0.8rem;
            margin-left: 0.3rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .btn-edit { background-color: #ffc107; color: #000 !important; }
        .btn-delete { background-color: var(--danger-btn); }

        #notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: var(--green-btn);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">VTX</div>
        <nav>
            <button id="nav-public" class="active" onclick="showSection('public-section')">السكربتات</button>
            <button id="nav-admin" onclick="showSection('admin-section')">الإدارة</button>
        </nav>
    </header>

    <div class="container">
        
        <!-- قسم السكربتات -->
        <section id="public-section" class="section active">
            <h2>قائمة السكربتات</h2>
            <div id="public-grid" class="scripts-grid">
                <p style="color: var(--text-muted);">جاري تحميل السكربتات...</p>
            </div>
        </section>

        <!-- قسم الإدارة -->
        <section id="admin-section" class="section">
            <div id="admin-login-box" class="form-box">
                <h2>دخول الإدارة</h2>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="admin-pass-input" placeholder="أدخل كلمة المرور">
                </div>
                <button class="btn-submit" onclick="checkAdminPassword()">دخول</button>
            </div>

            <div id="admin-dashboard" style="display: none;">
                <h2>لوحة الإدارة - إضافة / تعديل سكربت</h2>
                
                <div class="form-box" style="max-width: 100%;">
                    <input type="hidden" id="edit-doc-id" value="">
                    <div class="form-group">
                        <label>اسم السكربت</label>
                        <input type="text" id="script-name" placeholder="أدخل اسم السكربت">
                    </div>
                    <div class="form-group">
                        <label>رابط صورة السكربت (URL)</label>
                        <input type="text" id="script-image" placeholder="https://example.com/image.png">
                    </div>
                    <div class="form-group">
                        <label>كود السكربت</label>
                        <textarea id="script-code" placeholder="ضع كود السكربت هنا..."></textarea>
                    </div>
                    <button id="btn-save" class="btn-submit" onclick="saveScript()">إدراج</button>
                </div>

                <h2 style="margin-top: 2rem;">إدارة السكربتات الحالية</h2>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>الاسم</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                    </tbody>
                </table>
            </div>

        </section>

    </div>

    <div id="notification">تم نسخ السكربت بنجاح!</div>

    <script>
        // === ضع بيانات Firebase الخاصة بك هنا ===
        const firebaseConfig = {
            apiKey: "ضع_API_KEY_هنا",
            authDomain: "ضع_PROJECT_ID.firebaseapp.com",
            projectId: "ضع_PROJECT_ID_هنا",
            storageBucket: "ضع_PROJECT_ID.appspot.com",
            messagingSenderId: "ضع_SENDER_ID",
            appId: "ضع_APP_ID"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const ADMIN_PASS = "vtx131211";
        let localScriptsCache = [];

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            if(sectionId === 'public-section') {
                document.getElementById('nav-public').classList.add('active');
            } else {
                document.getElementById('nav-admin').classList.add('active');
            }
        }

        function checkAdminPassword() {
            const inputPass = document.getElementById('admin-pass-input').value;
            if (inputPass === ADMIN_PASS) {
                document.getElementById('admin-login-box').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                renderAdminTable();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        // الاستماع للتغييرات في قاعدة البيانات مباشرة (Real-time)
        db.collection("scripts").onSnapshot((snapshot) => {
            localScriptsCache = [];
            snapshot.forEach((doc) => {
                localScriptsCache.push({ id: doc.id, ...doc.data() });
            });
            renderPublicScripts();
            renderAdminTable();
        }, (error) => {
            console.error("خطأ في جلب البيانات:", error);
        });

        function renderPublicScripts() {
            const grid = document.getElementById('public-grid');
            grid.innerHTML = '';

            if (localScriptsCache.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">لا توجد سكربتات حالياً.</p>';
                return;
            }

            localScriptsCache.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'script-card';
                card.innerHTML = `
                    <img src="${item.image || 'https://via.placeholder.com/300/16161e/ffffff?text=No+Image'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/300/16161e/ffffff?text=Error+Image'">
                    <div class="script-card-body">
                        <div class="script-title">${item.name}</div>
                        <button class="btn-take" onclick="copyScriptCode('${item.id}')">أخذ</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function copyScriptCode(id) {
            const target = localScriptsCache.find(s => s.id === id);
            if (target && target.code) {
                navigator.clipboard.writeText(target.code).then(() => {
                    showNotification();
                });
            }
        }

        function showNotification() {
            const notif = document.getElementById('notification');
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 2000);
        }

        // حفظ أو تعديل السكربت في قاعدة البيانات
        async function saveScript() {
            const name = document.getElementById('script-name').value.trim();
            const image = document.getElementById('script-image').value.trim();
            const code = document.getElementById('script-code').value.trim();
            const docId = document.getElementById('edit-doc-id').value;

            if (!name || !code) {
                alert('يرجى كتابة اسم السكربت والكود!');
                return;
            }

            try {
                if (docId) {
                    // تعديل
                    await db.collection("scripts").doc(docId).update({ name, image, code });
                } else {
                    // إدراج جديد
                    await db.collection("scripts").add({ name, image, code, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                }
                resetForm();
            } catch (err) {
                alert("حدث خطأ أثناء الحفظ: " + err.message);
            }
        }

        function editScript(id) {
            const item = localScriptsCache.find(s => s.id === id);
            if(item) {
                document.getElementById('script-name').value = item.name;
                document.getElementById('script-image').value = item.image;
                document.getElementById('script-code').value = item.code;
                document.getElementById('edit-doc-id').value = item.id;
                document.getElementById('btn-save').innerText = "حفظ التعديلات";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function deleteScript(id) {
            if (confirm('هل أنت تأكد من حذف هذا السكربت؟')) {
                try {
                    await db.collection("scripts").doc(id).delete();
                } catch(err) {
                    alert("حدث خطأ أثناء الحذف: " + err.message);
                }
            }
        }

        function renderAdminTable() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';

            localScriptsCache.forEach((item) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${item.image}" onerror="this.src='https://via.placeholder.com/50'"></td>
                    <td>${item.name}</td>
                    <td class="action-btns">
                        <button class="btn-edit" onclick="editScript('${item.id}')">تعديل</button>
                        <button class="btn-delete" onclick="deleteScript('${item.id}')">حذف</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function resetForm() {
            document.getElementById('script-name').value = '';
            document.getElementById('script-image').value = '';
            document.getElementById('script-code').value = '';
            document.getElementById('edit-doc-id').value = '';
            document.getElementById('btn-save').innerText = "إدراج";
        }
    </script>
</body>
</html>
